<head>
    <meta charset="UTF-8">

    <title>StudySpot</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<section class="hero">

    <nav class="navbar">

        <div class="logo">
            <span>✦</span>
            StudySpot
        </div>

        <div class="navlinks">
            <a href="#">Home</a>
            <a href="#">Study Spots</a>
            <a href="#">Groups</a>
            <a href="#">Leaderboard</a>
            <a href="#">About</a>
        </div>

        <div class="navbuttons">
            <button class="login">Login</button>
            <button class="signup">Sign Up</button>
        </div>

    </nav>

    <div class="hero-content">

        <div class="location">
            <span>📍</span>
            Jamia Millia Islamia
        </div>

        <h1>
            Find Your<br>
            Perfect <span>Study Spot</span>
        </h1>

        <p>
            Discover the best places to study on campus with real-time
            crowd updates, reviews, and study partners.
        </p>

        <div class="search-box">
            <span>⌕</span>
            <input type="text" placeholder="Search library, labs, classrooms...">
            <button>Search</button>
        </div>

        <div class="categories">

            <button> Library</button>
            <button> Reading Room</button>
            <button> Classrooms</button>
            <button>Labs</button>
            <button> Canteen</button>
            <button> Hostel Rooms</button>

        </div>

    </div>
